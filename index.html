<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Lam Nguyen</title>
  <meta name="description" content="Portfolio of art and design work — 2D, 3D, and design." />
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>

<body data-page="index">

  <!-- ─── LOADING SCREEN ─── -->
  <div id="loader" class="loader-overlay" aria-live="polite">
    <div class="loader-percentage" id="loaderPercentage">00%</div>
  </div>

  <!-- ─── EDGE FADES ─── -->
  <div class="edge-fade edge-fade--top" aria-hidden="true">
    <div class="ef-color"></div>
    <div class="ef-layer" style="--blur: 0px; --stop1: 100%; --stop2: 100%;"></div>
    <div class="ef-layer" style="--blur: 0px; --stop1: 92%; --stop2: 100%;"></div>
    <div class="ef-layer" style="--blur: 0px; --stop1: 84%; --stop2: 98%;"></div>
    <div class="ef-layer" style="--blur: 2px; --stop1: 74%; --stop2: 88%;"></div>
    <div class="ef-layer" style="--blur: 4px; --stop1: 62%; --stop2: 76%;"></div>
    <div class="ef-layer" style="--blur: 7px; --stop1: 48%; --stop2: 62%;"></div>
    <div class="ef-layer" style="--blur: 10px; --stop1: 34%; --stop2: 48%;"></div>
    <div class="ef-layer" style="--blur: 16px; --stop1: 20%; --stop2: 34%;"></div>
  </div>
  <div class="edge-fade edge-fade--bottom" aria-hidden="true">
    <div class="ef-color"></div>
    <div class="ef-layer" style="--blur: 0px; --stop1: 100%; --stop2: 100%;"></div>
    <div class="ef-layer" style="--blur: 0px; --stop1: 92%; --stop2: 100%;"></div>
    <div class="ef-layer" style="--blur: 0px; --stop1: 84%; --stop2: 98%;"></div>
    <div class="ef-layer" style="--blur: 2px; --stop1: 74%; --stop2: 88%;"></div>
    <div class="ef-layer" style="--blur: 4px; --stop1: 62%; --stop2: 76%;"></div>
    <div class="ef-layer" style="--blur: 7px; --stop1: 48%; --stop2: 62%;"></div>
    <div class="ef-layer" style="--blur: 10px; --stop1: 34%; --stop2: 48%;"></div>
    <div class="ef-layer" style="--blur: 16px; --stop1: 20%; --stop2: 34%;"></div>
  </div>

  <!-- ─── NAVBAR ─── -->
  <header class="site-header">
    <a class="logo" href="index.html#all">
      <span class="logo-name">LAM NGUYEN</span>
      <span class="logo-sub">ART &amp; DESIGN</span>
    </a>

    <div class="cat-nav-wrap">

      <nav class="cat-nav" aria-label="Gallery categories">
        <div class="cat-nav-indicator" id="navIndicator"></div>
        <a href="index.html#all" class="cat-link active" data-cat="all">ALL</a>
        <a href="index.html#2d" class="cat-link " data-cat="2d">2D</a>
        <a href="index.html#3d" class="cat-link " data-cat="3d">3D</a>
        <a href="index.html#design" class="cat-link " data-cat="design">DESIGN</a>
      </nav>
    </div>

    <div class="nav-right">
      <a class="about-link " href="about.html" data-tooltip="ABOUT">ABOUT</a>
    </div>
  </header>

  <!-- ─── GALLERY ─── -->
  <main class="gallery-grid" id="galleryGrid" data-filter="all">
    <!-- tiles injected by works.js + main.js -->
  </main>

  <!-- ─── LIGHTBOX ─── -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
    
    <div class="lb-container">
      <!-- Left sidebar: Year, Category, and Prev arrow -->
      <div class="lb-sidebar-left">
        <div class="lb-left-meta">
          <div class="lb-year-top" id="lbYearTop"></div>
          <div class="lb-cat-left" id="lbCatLeft"></div>
        </div>
        <button class="lb-prev" id="lbPrev" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
      </div>
      
      <!-- Center rounded container: Image + Right details -->
      <div class="lb-inner">
        <div class="lb-img-wrap">
          <img class="lb-img" id="lbImg" src="" alt="" />
        </div>
        <div class="lb-right">
          <h2 class="lb-title" id="lbTitle"></h2>
          <p class="lb-desc" id="lbDesc"></p>
        </div>
      </div>
      
      <!-- Right sidebar: Next arrow -->
      <div class="lb-sidebar-right">
        <button class="lb-next" id="lbNext" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ─── FOOTER ─── -->
  <footer class="site-footer">
    <div class="footer-left">
      <span>©<span id="yr"></span>&nbsp;Lam Nguyen</span>
    </div>
    <div class="footer-right">
      <a href="mailto:hello@lamnguyen.design">hello@lamnguyen.design</a>
      <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
      <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle Theme">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </button>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/works.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
