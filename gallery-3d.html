<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D — Portfolio</title>
  <meta name="description" content="Portfolio of art and design work — 2D, 3D, and design." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body data-page="gallery-3d">

  <!-- ─── EDGE FADES ─── -->
  <div class="edge-fade edge-fade--top" aria-hidden="true">
    <div class="ef-color"></div>
    <div class="ef-layer" style="--blur: 0px; --stop1: 100%; --stop2: 100%;"></div>
    <div class="ef-layer" style="--blur: 0px; --stop1: 92%; --stop2: 100%;"></div>
    <div class="ef-layer" style="--blur: 0px; --stop1: 84%; --stop2: 98%;"></div>
    <div class="ef-layer" style="--blur: 2px; --stop1: 74%; --stop2: 88%;"></div>
    <div class="ef-layer" style="--blur: 4px; --stop1: 62%; --stop2: 76%;"></div>
    <div class="ef-layer" style="--blur: 7px; --stop1: 48%; --stop2: 62%;"></div>
    <div class="ef-layer" style="--blur: 10px; --stop1: 34%; --stop2: 48%;"></div>
    <div class="ef-layer" style="--blur: 16px; --stop1: 20%; --stop2: 34%;"></div>
  </div>
  <div class="edge-fade edge-fade--bottom" aria-hidden="true">
    <div class="ef-color"></div>
    <div class="ef-layer" style="--blur: 0px; --stop1: 100%; --stop2: 100%;"></div>
    <div class="ef-layer" style="--blur: 0px; --stop1: 92%; --stop2: 100%;"></div>
    <div class="ef-layer" style="--blur: 0px; --stop1: 84%; --stop2: 98%;"></div>
    <div class="ef-layer" style="--blur: 2px; --stop1: 74%; --stop2: 88%;"></div>
    <div class="ef-layer" style="--blur: 4px; --stop1: 62%; --stop2: 76%;"></div>
    <div class="ef-layer" style="--blur: 7px; --stop1: 48%; --stop2: 62%;"></div>
    <div class="ef-layer" style="--blur: 10px; --stop1: 34%; --stop2: 48%;"></div>
    <div class="ef-layer" style="--blur: 16px; --stop1: 20%; --stop2: 34%;"></div>
  </div>

  <!-- ─── NAVBAR ─── -->
  <header class="site-header">
    <a class="logo" href="index.html">
      <span class="logo-name">YOUR NAME</span>
      <span class="logo-sub">ART &amp; DESIGN</span>
    </a>

    <div class="cat-nav-wrap">

      <nav class="cat-nav" aria-label="Gallery categories">
        <div class="cat-nav-indicator" id="navIndicator"></div>
        <a href="index.html"           class="cat-link "    data-cat="all">ALL</a>
        <a href="gallery-2d.html"      class="cat-link "     data-cat="2d">2D</a>
        <a href="gallery-3d.html"      class="cat-link active"     data-cat="3d">3D</a>
        <a href="gallery-design.html"  class="cat-link " data-cat="design">DESIGN</a>
      </nav>
    </div>

    <div class="nav-right">
      <a class="about-link " href="about.html" data-tooltip="ABOUT">ABOUT</a>
    </div>
  </header>

  <!-- ─── GALLERY ─── -->
  <main class="gallery-grid" id="galleryGrid" data-filter="3d">
    <!-- tiles injected by works.js + main.js -->
  </main>

  <!-- ─── LIGHTBOX ─── -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
    <button class="lb-prev"  id="lbPrev"  aria-label="Previous">&#8592;</button>
    <button class="lb-next"  id="lbNext"  aria-label="Next">&#8594;</button>
    <div class="lb-inner">
      <div class="lb-img-wrap">
        <img class="lb-img" id="lbImg" src="" alt="" />
      </div>
      <div class="lb-meta">
        <p class="lb-cat"   id="lbCat"></p>
        <h2 class="lb-title" id="lbTitle"></h2>
        <p class="lb-desc"  id="lbDesc"></p>
      </div>
    </div>
  </div>

  <!-- ─── FOOTER ─── -->
  <footer class="site-footer">
    <span>©<span id="yr"></span>&nbsp;Your Name</span>
    <a href="mailto:hello@yoursite.com">hello@yoursite.com</a>
    <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
  </footer>

  <script src="https://unpkg.com/lenis@1.1.5/dist/lenis.min.js"></script>
  <script src="js/works.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
